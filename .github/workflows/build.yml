name: Build Fabric mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Check bundled packs
        run: |
          test -f src/main/resources/data/p1/functions/start.mcfunction
          test -f src/main/resources/data/p2/functions/start.mcfunction
          test -f src/main/resources/assets/primes/icon.png
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prime-sanctums-fabric-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
