plugins { id 'fabric-loom' version '1.6-SNAPSHOT' }
version = '1.0.0+1.20.1'
group = 'com.cpiq.primes'
base { archivesName = 'prime-sanctums' }
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
